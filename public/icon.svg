<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix overlay -->
  <path d="M64 128h384M64 192h384M64 256h384M64 320h384M64 384h384 M128 64v384M192 64v384M256 64v384M320 64v384M384 64v384" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Outer Cyber Shield -->
  <path d="M256 72 L394 134 C394 286 338 376 256 438 C174 376 118 286 118 134 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Inner Shield Fill -->
  <path d="M256 102 L368 152 C368 274 322 348 256 398 C190 348 144 274 144 152 Z" fill="#0f172a" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Radar Scanner Sweep Rings -->
  <circle cx="256" cy="246" r="88" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="246" r="54" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="246" r="22" fill="#06b6d4" opacity="0.3"/>
  
  <!-- Central Sentinel Target Crosshair -->
  <path d="M256 168v40 M256 284v40 M178 246h40 M294 246h40" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Tactical Center Scope Point -->
  <circle cx="256" cy="246" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="246" r="4" fill="#0284c7"/>
  
  <!-- Corner Tech Accents -->
  <path d="M168 130 L256 92 L344 130" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="320" cy="210" r="4" fill="#10b981"/>
  <circle cx="196" cy="270" r="4" fill="#f59e0b"/>
  <circle cx="280" cy="290" r="4" fill="#ef4444"/>
</svg>
